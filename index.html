<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Digital Lombok</title>
  <style>
    :root{
      --bg:#eef1f6;--panel:#fff;--ink:#14213d;--mute:#5b6577;--line:#d5dbe6;--acc:#2447d6;--accink:#fff;
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif;font-size:14px}
    .container{max-width:1100px;margin:0 auto;padding:16px}
    .header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:2}
    .brand{display:flex;align-items:center;gap:10px}
    .brand img{height:34px;width:auto;display:block}
    .brand b{display:block;font-size:15px}
    .brand span{display:block;color:var(--mute);font-size:11px}
    .tabs{display:flex;gap:8px;flex-wrap:wrap}
    .tab{border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:8px 12px;border-radius:10px;cursor:pointer}
    .tab.active{background:var(--acc);color:var(--accink);border-color:var(--acc);font-weight:700}
    .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:12px}
    h2{margin:0 0 12px;font-size:14px}
    label{display:block;margin:10px 0 6px;color:var(--mute);font-size:12px}
    input,select,textarea,button{font:inherit}
    input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
    textarea{min-height:90px;resize:vertical}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .btn{padding:10px 12px;border:1px solid var(--line);background:var(--panel);border-radius:10px;cursor:pointer}
    .btn.primary{background:var(--acc);color:var(--accink);border-color:var(--acc);font-weight:700}
    .muted{color:var(--mute);font-size:12px}
    .xg{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;background:var(--bg);border-radius:8px;font-weight:800;font-size:12px;margin:14px 0 8px}
    .xlist{display:grid;gap:8px}
    .xitem{padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
    .xitem .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
    .xitem .status{font-weight:700;font-size:12px;padding:4px 8px;border-radius:999px}
    .status.siap{background:#dff5e8;color:#1b8a3a}
    .status.perlu{background:#fff2d6;color:#b36b00}
    .status.rusak{background:#ffe0e0;color:#b00020}
    .grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
    .mini{font-size:11px;color:var(--mute)}
    .mini b{display:block;color:var(--ink);font-size:12px;margin-top:2px}
    .status-select{padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel)}
    .notes{margin-top:8px}
    .notes input{padding:8px}
    .badge{display:inline-block;padding:4px 8px;border-radius:999px;background:var(--bg);font-size:11px;color:var(--mute);border:1px solid var(--line)}
    .footer-note{margin-top:10px;font-size:12px;color:var(--mute)}
    @media (max-width: 600px){.row,.grid2{grid-template-columns:1fr}.header{flex-direction:column;align-items:flex-start}.tabs{width:100%}}
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <img id="logo" alt="Digital Lombok" src="" />
      <div>
        <b>Digital Lombok</b>
        <span id="dbmsg">Database: Google Sheets</span>
      </div>
    </div>
    <div class="tabs">
      <button class="tab active" data-view="doc">Dokumen</button>
      <button class="tab" data-view="barang">Barang</button>
    </div>
  </div>

  <div class="container">
    <section id="view-doc" class="view">
      <div class="card">
        <h2>Dokumen</h2>
        <div class="row">
          <div>
            <label>Nomor</label>
            <input id="no" />
          </div>
          <div>
            <label>Tanggal</label>
            <input id="tgl" type="date" />
          </div>
        </div>
        <label>Jenis</label>
        <select id="jenis">
          <option value="quo">Penawaran</option>
          <option value="inv">Invoice</option>
          <option value="kwt">Kwitansi</option>
        </select>
        <label>Sudah dibayar / DP (Rp)</label>
        <input id="paid" type="number" min="0" value="0" />
      </div>

      <div class="card">
        <h2>Peralatan & jasa</h2>
        <select id="pick"></select>
        <div class="row" style="margin-top:8px;">
          <button class="btn primary" id="add">+ Dari master</button>
          <button class="btn" id="custom">+ Manual</button>
        </div>
        <div id="items" style="margin-top:10px"></div>
      </div>
    </section>

    <section id="view-barang" class="view" style="display:none">
      <div class="card">
        <h2>Stok & jenis</h2>
        <div class="row">
          <div>
            <label>Dari tanggal</label>
            <input id="xd1" type="date" />
          </div>
          <div>
            <label>Sampai tanggal</label>
            <input id="xd2" type="date" />
          </div>
        </div>
        <div class="row" style="margin-top:8px;">
          <button class="btn primary" id="xrefresh">Muat ulang dari Sheets</button>
          <button class="btn" id="xauto">Isi jenis otomatis</button>
        </div>
        <div id="xdmsg" class="footer-note"></div>
        <div id="xlist" class="xlist" style="margin-top:10px"></div>

        <div class="xg">
          <span>Maintenance peralatan</span>
          <span id="xmcnt">0 item</span>
        </div>
        <div id="xmaint" class="xlist"></div>
      </div>
    </section>
  </div>

  <script>
    const LOGO = "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAtAAAAKzCAYAAAA3NzpoAAEAAElEQVR42uzde3xc510n/s/3ec6ZGY0kO0pqJ07S1rnQFLdNL6aFcqmyLS2GhrTAntBaspUmRYUsZjeULr+F5Tee5bLsshDA1IWBupEtOW2HLbSbgqELjaBcOf2Yh89x+0Pq5GuGclSqZg7LM9w1FUCwAAAPZJREFUeNo1j2EJAAAABJ0k3u1TnNPhHf5m7uM2YIYHj3f6kHpnXwA8w8QFgqU7BpjbQv3Td9nmpqlm9YvCmrup7c4X7n8+6kIX1UUk4DnA1eVhaAAAnLQFLgAAABJRU5ErkJggg==";
    const GOOGLE_SHEET_URL = "https://script.google.com/macros/s/AKfycbw0ZZvZg_7_fVHY5Jr5Ouc62J5mV_ddojcvwg92cfbyuAYQai3EYd8Sx3t76BPRySoqUQ/exec";

    let MASTER = [
      ["BRG-001","LED Display 3x4m",2500000,"unit"],
      ["BRG-002","Sound System 5000W",1500000,"set"],
      ["BRG-003","Moving Head Beam 230W",300000,"unit"],
      ["BRG-004","Stage Rigging 6x8m",3500000,"set"],
      ["BRG-005","Lighting Truss 6m",1900000,"set"]
    ];
    let EX = {};
    let items = [];

    const $ = (id) => document.getElementById(id);
    const rp = (n) => "Rp " + Math.round(Number(n || 0)).toLocaleString("id-ID");
    const esc = (s) => String(s ?? "").replace(/[&<>\"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
    const toNum = (v) => Number(v || 0);

    function apiGet(action) {
      return new Promise((resolve, reject) => {
        const cb = "dl_cb_" + Date.now() + "_" + Math.random().toString(16).slice(2);
        const script = document.createElement("script");
        let done = false;
        const doneFn = (ok, data) => {
          if (done) return;
          done = true;
          clearTimeout(timer);
          script.remove();
          if (ok) resolve(data); else reject(new Error((data && data.message) || "Gagal membaca data."));
        };
        const timer = setTimeout(() => doneFn(false, { message: "Timeout koneksi Google Sheets." }), 15000);
        window[cb] = function (data) {
          doneFn(Boolean(data && data.ok), data || { message: "Respons kosong." });
        };
        script.onerror = () => doneFn(false, { message: "Gagal menghubungi Apps Script." });
        script.src = GOOGLE_SHEET_URL + "?action=" + encodeURIComponent(action) + "&callback=" + encodeURIComponent(cb) + "&_=" + Date.now();
        document.head.appendChild(script);
      });
    }

    function apiPost(payload) {
      return new Promise((resolve, reject) => {
        const iframe = document.createElement("iframe");
        iframe.name = "dl_post_" + Date.now();
        iframe.style.display = "none";
        const form = document.createElement("form");
        form.method = "POST";
        form.action = GOOGLE_SHEET_URL;
        form.target = iframe.name;
        form.style.display = "none";
        const input = document.createElement("input");
        input.type = "hidden";
        input.name = "payload";
        input.value = JSON.stringify(payload);
        form.appendChild(input);
        document.body.appendChild(iframe);
        document.body.appendChild(form);

        let done = false;
        const finish = (ok, msg) => {
          if (done) return;
          done = true;
          setTimeout(() => {
            form.remove();
            iframe.remove();
          }, 200);
          if (ok) resolve({ ok: true, message: msg });
          else reject(new Error(msg));
        };

        const timer = setTimeout(() => finish(false, "Waktu habis saat mengirim data."), 15000);
        iframe.onload = () => {
          clearTimeout(timer);
          finish(true, "Data berhasil dikirim.");
        };
        iframe.onerror = () => {
          clearTimeout(timer);
          finish(false, "Gagal mengirim data ke Apps Script.");
        };

        try { form.submit(); } catch (e) { clearTimeout(timer); finish(false, e.message || "Gagal submit data."); }
      });
    }

    function fillPick() {
      const selected = $("pick").value;
      $("pick").innerHTML = MASTER.map((m, i) => `<option value="${i}">${esc(m[1])} - ${rp(m[2])}</option>`).join("");
      if (selected && MASTER[Number(selected)]) $("pick").value = selected;
    }

    function drawM() {
      $("items").innerHTML = items.length
        ? items.map((it, i) => `
            <div class="item" style="display:grid;grid-template-columns:1fr 80px 70px 70px 36px;gap:6px;align-items:center;margin-bottom:8px;">
              <div style="font-weight:700;font-size:13px;grid-column:1/-1;">${esc(it.n || "Item")}</div>
              <input data-i="${i}" data-k="p" type="number" min="0" value="${it.p || 0}" style="padding:6px;" />
              <input data-i="${i}" data-k="q" type="number" min="1" value="${it.q || 1}" style="padding:6px;" />
              <input data-i="${i}" data-k="d" type="number" min="1" value="${it.d || 1}" style="padding:6px;" />
              <button data-x="${i}" class="btn" style="padding:6px 8px;">x</button>
            </div>
          `).join("")
        : '<p class="muted">Belum ada item. Pilih dari master atau tambah manual.</p>';

      document.querySelectorAll("#items input").forEach((el) => {
        el.oninput = () => {
          const item = items[Number(el.dataset.i)];
          const key = el.dataset.k;
          item[key] = key === "n" ? el.value : Number(el.value || 0);
        };
      });

      document.querySelectorAll("#items button[data-x]").forEach((btn) => {
        btn.onclick = () => {
          items.splice(Number(btn.dataset.x), 1);
          drawM();
        };
      });
    }

    $("add").onclick = () => {
      const m = MASTER[Number($("pick").value)] || MASTER[0];
      items.push({ n: m[1], p: m[2], q: 1, d: 1 });
      drawM();
    };

    $("custom").onclick = () => {
      items.push({ n: "Item baru", p: 0, q: 1, d: 1, c: true });
      drawM();
    };

    document.querySelector(".tab[data-view='barang']").onclick = () => {
      document.getElementById("view-doc").style.display = "none";
      document.getElementById("view-barang").style.display = "block";
      document.querySelectorAll(".tab").forEach((tab) => tab.classList.toggle("active", tab.dataset.view === "barang"));
      drawMaintenance();
      drawStok();
    };

    document.querySelector(".tab[data-view='doc']").onclick = () => {
      document.getElementById("view-doc").style.display = "block";
      document.getElementById("view-barang").style.display = "none";
      document.querySelectorAll(".tab").forEach((tab) => tab.classList.toggle("active", tab.dataset.view === "doc"));
    };

    function getCurrentExtras() {
      const data = MASTER.map((m) => {
        const e = EX[m[0]] || {};
        return {
          id: m[0],
          n: m[1],
          p: Number(m[2]) || 0,
          u: m[3] || "unit",
          k: e.k || "",
          s: e.s == null ? "" : e.s,
          ms: e.ms || "siap",
          mt: e.mt || "",
          mn: e.mn || "",
          m: e.m || ""
        };
      });
      return data;
    }

    function saveMaster() {
      const payload = { action: "saveMaster", data: getCurrentExtras() };
      $("dbmsg").textContent = "Menyimpan data maintenance...";
      apiPost(payload)
        .then(() => {
          $("dbmsg").textContent = "Data maintenance tersimpan ke Google Sheets.";
          $("dbmsg").style.color = "green";
        })
        .catch((err) => {
          $("dbmsg").textContent = "Gagal menyimpan: " + err.message;
          $("dbmsg").style.color = "#b00020";
        });
    }

    function guessType(name) {
      const n = String(name || "").toLowerCase();
      if (/sound|mic|audio|speaker/.test(n)) return "Audio";
      if (/beam|moving|light|lamp|led/.test(n)) return "Lighting";
      if (/stage|rigging|truss/.test(n)) return "Staging";
      if (/video|camera|tripod|switcher|monitor/.test(n)) return "Video";
      if (/power|genset|panel/.test(n)) return "Power";
      return "Lainnya";
    }

    function drawMaintenance() {
      const rows = MASTER.map((m) => {
        const e = EX[m[0]] || {};
        const status = (e.ms || "siap").toLowerCase();
        const cls = status === "perlu" ? "perlu" : status === "rusak" ? "rusak" : "siap";
        return `
          <div class="xitem">
            <div class="top">
              <strong>${esc(m[1])}</strong>
              <span class="status ${cls}">${status === "perlu" ? "Perlu servis" : status === "rusak" ? "Rusak" : "Siap pakai"}</span>
            </div>
            <div class="grid2" style="margin-top:8px;">
              <div class="mini">Terakhir servis<b>${esc(e.mt || "-")}</b></div>
              <div class="mini">Jadwal next<b>${esc(e.mn || "-")}</b></div>
            </div>
            <div class="grid2" style="margin-top:8px;">
              <select class="status-select" data-maint-id="${esc(m[0])}" data-field="ms">
                <option value="siap" ${status === "siap" ? "selected" : ""}>Siap pakai</option>
                <option value="perlu" ${status === "perlu" ? "selected" : ""}>Perlu servis</option>
                <option value="rusak" ${status === "rusak" ? "selected" : ""}>Rusak</option>
              </select>
              <input type="date" data-maint-id="${esc(m[0])}" data-field="mt" value="${e.mt || ""}" />
            </div>
            <div class="grid2" style="margin-top:8px;">
              <input type="date" data-maint-id="${esc(m[0])}" data-field="mn" value="${e.mn || ""}" />
              <input type="text" data-maint-id="${esc(m[0])}" data-field="m" value="${esc(e.m || "")}" placeholder="Catatan maintenance" />
            </div>
          </div>
        `;
      }).join("") || '<p class="muted">Belum ada barang.</p>';

      $("xmaint").innerHTML = rows;
      $("xmcnt").textContent = MASTER.length + " item";

      document.querySelectorAll("[data-field]").forEach((el) => {
        el.onchange = () => {
          const id = el.dataset.maintId;
          const field = el.dataset.field;
          const entry = EX[id] || {};
          entry[field] = el.value || "";
          if (field === "ms") entry.ms = el.value || "siap";
          EX[id] = entry;
          saveMaster();
          drawMaintenance();
        };
      });
    }

    function drawStok() {
      const d1 = $("xd1").value;
      const d2 = $("xd2").value;
      const exList = MASTER.map((m) => {
        const e = EX[m[0]] || {};
        const type = e.k || "";
        return `<div class="xitem">
          <div class="top">
            <strong>${esc(m[1])}</strong>
            <span class="badge">${esc(type || "Belum dikategorikan")}</span>
          </div>
          <div class="grid2" style="margin-top:8px;">
            <div class="mini">Stok<b>${esc(e.s == null ? "-" : e.s)}</b></div>
            <div class="mini">Maks. tanggal<b>${esc(d1 && d2 ? d1 + " s.d. " + d2 : "-")}</b></div>
          </div>
          <div style="margin-top:8px;display:flex;gap:6px;align-items:center;">
            <input data-id="${esc(m[0])}" data-field="k" type="text" value="${esc(type)}" placeholder="Jenis peralatan" style="padding:8px;" />
            <input data-id="${esc(m[0])}" data-field="s" type="number" min="0" value="${e.s ?? ""}" placeholder="Stok" style="padding:8px;" />
          </div>
        </div>`;
      }).join("") || '<p class="muted">Belum ada barang.</p>';

      $("xlist").innerHTML = exList;

      document.querySelectorAll("[data-field='k']").forEach((input) => {
        input.onchange = () => {
          const id = input.dataset.id;
          const entry = EX[id] || {};
          entry.k = input.value || "";
          EX[id] = entry;
          saveMaster();
          drawMaintenance();
          drawStok();
        };
      });

      document.querySelectorAll("[data-field='s']").forEach((input) => {
        input.onchange = () => {
          const id = input.dataset.id;
          const entry = EX[id] || {};
          entry.s = input.value === "" ? "" : Number(input.value || 0);
          EX[id] = entry;
          saveMaster();
          drawMaintenance();
          drawStok();
        };
      });
    }

    $("xauto").onclick = () => {
      MASTER.forEach((m) => {
        const entry = EX[m[0]] || {};
        if (!entry.k) {
          entry.k = guessType(m[1]);
          EX[m[0]] = entry;
        }
      });
      saveMaster();
      drawMaintenance();
      drawStok();
    };

    $("xrefresh").onclick = () => {
      $("dbmsg").textContent = "Memuat data dari Google Sheets...";
      loadCloudData();
    };

    function loadCloudData() {
      if (!GOOGLE_SHEET_URL || GOOGLE_SHEET_URL.indexOf("PASTE_") === 0) {
        $("dbmsg").textContent = "URL Google Apps Script belum diisi.";
        return;
      }
      apiGet("bootstrap")
        .then((r) => {
          if (Array.isArray(r.master) && r.master.length) {
            MASTER = r.master.map((o) => [o.id, o.n, Number(o.p) || 0, o.u || "unit"]);
            const temp = {};
            r.master.forEach((o) => {
              temp[o.id] = {
                k: o.k || "",
                s: o.s == null ? "" : o.s,
                ms: o.ms || "siap",
                mt: o.mt || "",
                mn: o.mn || "",
                m: o.m || ""
              };
            });
            EX = temp;
          }
          $("dbmsg").textContent = "Terhubung ke Google Sheets.";
          $("dbmsg").style.color = "green";
          fillPick();
          drawMaintenance();
          drawStok();
        })
        .catch((err) => {
          $("dbmsg").textContent = "Belum terhubung: " + err.message;
          $("dbmsg").style.color = "#b00020";
        });
    }

    function initDefaults() {
      document.getElementById("logo").src = LOGO;
      const today = new Date().toISOString().slice(0, 10);
      $("tgl").value = today;
      $("no").value = "DL/QUO/" + today.slice(0, 4) + "/001";
      $("xd1").value = today;
      $("xd2").value = today;
      fillPick();
      drawM();
      drawMaintenance();
      drawStok();
    }

    initDefaults();
    loadCloudData();
  </script>
</body>
</html>
