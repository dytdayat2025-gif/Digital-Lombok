<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Digital Lombok</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0d1117;
            color: #c9d1d9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .login-card {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 32px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }

        .brand-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .brand-title {
            font-size: 24px;
            font-weight: 700;
            color: #ffffff;
            margin-top: 8px;
        }

        .brand-subtitle {
            font-size: 13px;
            color: #8b949e;
            margin-top: 4px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
            color: #c9d1d9;
        }

        .form-group input {
            width: 100%;
            padding: 10px 14px;
            background-color: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: #f0f6fc;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .form-group input:focus {
            border-color: #388bfd;
            box-shadow: 0 0 0 3px rgba(56, 139, 253, 0.3);
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background-color: #238636;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease;
            margin-top: 8px;
        }

        .btn-submit:hover {
            background-color: #2ea043;
        }

        .error-message {
            background-color: rgba(56, 139, 253, 0.1);
            border: 1px solid rgba(56, 139, 253, 0.4);
            color: #79c0ff;
            padding: 10px;
            border-radius: 6px;
            font-size: 13px;
            margin-bottom: 16px;
            display: none;
            text-align: center;
        }

        .account-link {
            display: block;
            margin-top: 18px;
            color: #79c0ff;
            text-align: center;
            font-size: 13px;
        }

        .account-link button {
            border: 0;
            background: none;
            color: inherit;
            cursor: pointer;
            font: inherit;
            text-decoration: underline;
        }

        .footer-note {
            text-align: center;
            margin-top: 24px;
            font-size: 12px;
            color: #8b949e;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="brand-header">
            <h1 class="brand-title">Digital Lombok</h1>
            <p class="brand-subtitle">Sistem Generator Penawaran & Invoice</p>
        </div>

        <div id="statusMessage" class="error-message" role="status" aria-live="polite"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="username">Username / Email</label>
                <input type="text" id="username" placeholder="Masukkan username" required autocomplete="username">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Masukkan password" required autocomplete="current-password">
            </div>

            <button type="submit" class="btn-submit">Masuk Sesi</button>
        </form>

        <form id="requestForm" hidden>
            <div class="form-group">
                <label for="newUsername">Username / Email</label>
                <input type="text" id="newUsername" required minlength="3" maxlength="64" autocomplete="username">
            </div>
            <div class="form-group">
                <label for="newPassword">Password baru</label>
                <input type="password" id="newPassword" required minlength="12" maxlength="128" autocomplete="new-password">
            </div>
            <button type="submit" class="btn-submit">Minta akun</button>
        </form>

        <div class="account-link"><button id="toggleRequest" type="button">Belum punya akun? Minta akun baru</button></div>

        <div class="footer-note">
            &copy; 2026 Digital Lombok. Event Equipment Rental & Production.
        </div>
    </div>

    <script>
        const GOOGLE_SHEET_URL = "https://script.google.com/macros/s/AKfycbxfZ016vXeORoFG7QSfZf1ABqsvlE9cKwNnB1AxXnUNBZnwI6-49NTLOsYCq3z62RtfbQ/exec";
        const statusMessage = document.getElementById("statusMessage");
        const loginForm = document.getElementById("loginForm");
        const requestForm = document.getElementById("requestForm");
        const toggleRequest = document.getElementById("toggleRequest");

        if (sessionStorage.getItem("sessionToken")) {
            window.location.href = "index.html";
        }

        function postAuth(action, data) {
            return new Promise(function(resolve, reject) {
                const requestId = "auth_" + Date.now() + "_" + Math.random().toString(36).slice(2);
                const target = "auth_frame_" + requestId;
                const iframe = document.createElement("iframe");
                iframe.name = target;
                iframe.hidden = true;
                const form = document.createElement("form");
                form.method = "POST";
                form.action = GOOGLE_SHEET_URL;
                form.target = target;
                form.hidden = true;
                const input = document.createElement("input");
                input.type = "hidden";
                input.name = "payload";
                input.value = JSON.stringify({ action: action, data: data, requestId: requestId });
                form.appendChild(input);
                document.body.append(iframe, form);

                let finished = false;
                const timer = setTimeout(function() {
                    finish(new Error("Server tidak merespons. Coba lagi."));
                }, 20000);

                function finish(error, result) {
                    if (finished) return;
                    finished = true;
                    clearTimeout(timer);
                    window.removeEventListener("message", onMessage);
                    setTimeout(function() {
                        iframe.remove();
                        form.remove();
                    }, 100);
                    if (error) reject(error);
                    else if (!result || !result.ok) reject(new Error(result && result.message || "Permintaan gagal."));
                    else resolve(result);
                }

                function onMessage(event) {
                    if (event.source !== iframe.contentWindow || !event.data || event.data.requestId !== requestId) return;
                    finish(null, event.data.result);
                }

                window.addEventListener("message", onMessage);
                form.submit();
            });
        }

        function showMessage(text, isError) {
            statusMessage.textContent = text;
            statusMessage.style.display = "block";
            statusMessage.style.color = isError ? "#f85149" : "#7ee787";
        }

        toggleRequest.addEventListener("click", function() {
            const requesting = loginForm.hidden === false;
            loginForm.hidden = requesting;
            requestForm.hidden = !requesting;
            toggleRequest.textContent = requesting ? "Sudah punya akun? Masuk" : "Belum punya akun? Minta akun baru";
            statusMessage.style.display = "none";
        });

        loginForm.addEventListener("submit", function(event) {
            event.preventDefault();
            const button = loginForm.querySelector("button[type=submit]");
            button.disabled = true;
            postAuth("login", {
                username: document.getElementById("username").value,
                password: document.getElementById("password").value
            }).then(function(result) {
                sessionStorage.setItem("sessionToken", result.token);
                sessionStorage.setItem("sessionUser", JSON.stringify(result.user));
                window.location.href = "index.html";
            }).catch(function(error) {
                showMessage(error.message, true);
                button.disabled = false;
            });
        });

        requestForm.addEventListener("submit", function(event) {
            event.preventDefault();
            const button = requestForm.querySelector("button[type=submit]");
            button.disabled = true;
            postAuth("requestAccount", {
                username: document.getElementById("newUsername").value,
                password: document.getElementById("newPassword").value
            }).then(function(result) {
                showMessage(result.message, false);
                requestForm.reset();
            }).catch(function(error) {
                showMessage(error.message, true);
            }).finally(function() {
                button.disabled = false;
            });
        });
    </script>

</body>
</html>
